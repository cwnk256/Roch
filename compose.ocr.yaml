services:
  ocr:
    build:
      context: ./ocr
    platform: linux/amd64
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 4g
    cpus: 4
    ports:
      - "127.0.0.1:${ROCH_OCR_PORT:-18765}:8080"
    networks:
      - ocr-local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 90s

networks:
  ocr-local:
    driver: bridge
