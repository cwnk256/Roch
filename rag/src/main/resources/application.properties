spring.application.name=rag
# ============ PostgreSQL / Flyway（Phase 3 任务、结果与资产持久化） ============
spring.datasource.url=jdbc:postgresql://localhost:5432/roch
spring.datasource.username=roch
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# ============ Spring AI 2.0 - OpenAI 兼容协议（LM Studio） ============
# LM Studio 默认本地服务地址
spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio 无需真实密钥，填写占位即可
spring.ai.openai.api-key=lm-studio
# 对话模型：google/gemma-4-e4b
spring.ai.openai.chat.model=google/gemma-4-e4b
spring.ai.openai.chat.temperature=0.7
# 向量嵌入模型：text-embedding-bge-m3
spring.ai.openai.embedding.model=text-embedding-bge-m3
# ============ Milvus 向量库（与 compose.yaml 部署一致） ============
spring.ai.vectorstore.milvus.client.host=localhost
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.databaseName=default
spring.ai.vectorstore.milvus.collectionName=rag_docs
# 与 bge-m3 输出维度一致
spring.ai.vectorstore.milvus.embeddingDimension=1024
# 启动时自动创建 Collection
spring.ai.vectorstore.milvus.initialize-schema=true
# ============ 文件上传限制（Spring Boot 4 同样支持 spring.servlet.multipart 前缀） ============
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ============ Knife4j / OpenAPI 文档 ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ============ 多轮会话记忆 ============
# 滑动窗口保留的消息条数（user + assistant 各计一条）
rag.chat.memory.max-messages=20
# RAG 检索开关（全局默认，可被请求参数覆盖）
rag.chat.rag.enabled=false
# 召回条数与相似度阈值
rag.chat.rag.top-k=8
rag.chat.rag.similarity-threshold=0.35
# 多轮问答"读取网址"工具返回给模型的网页正文最大字符数（超出截断，避免撑爆上下文）
rag.chat.tool.webpage.max-chars=12000
# ============ 被召回文档日志 ============
# 是否记录检索日志（关闭后不构造、不写盘）
rag.retrieval.log.enabled=true
# 正文预览字符数；0 表示不记录正文（避免隐私泄露与日志膨胀）
rag.retrieval.log.preview-chars=0
# 内存查询缓冲容量（P1），超出丢弃最旧记录
rag.retrieval.buffer-size=500
# ============ Spring AI 内置召回内容日志（排障兜底，默认关闭） ============
# 打开后会把召回切片完整正文打到日志，仅用于临时排障，生产务必保持 false
spring.ai.vectorstore.observations.log-query-response=false
# ============ 检索管道（Phase 4：vector / keyword / hybrid+RRF） ============
# 默认检索模式；hybrid 默认关闭，需 benchmark 证明收益后再切换
rag.retrieval.mode=vector
# RRF 常数 k（论文推荐 60，越大排名差异越平滑）与双路权重
rag.retrieval.rrf.k=60
rag.retrieval.rrf.vector-weight=1.0
rag.retrieval.rrf.keyword-weight=1.0
# ============ 数据清洗（TXT 导入切片前） ============
# 清洗总开关；关闭后走纯语义切片（旧版行为）
rag.cleaning.enabled=true
# 普通正文/表格单元格英文小写化（URL、代码块保持原样）
rag.cleaning.lowercase=true
# 过滤显式目录标题区（# 目录 / ## 目录 / CONTENTS 等）
rag.cleaning.filter-toc=true
# ============ 切片策略与参数 ============
# 流水线版本：同文件版本变化时触发重建，同版本重复导入跳过
# heading-aware-v2：标题感知切片，切片携带 section_id/section_path/section_level
rag.chunking.pipeline-version=heading-aware-v2
rag.chunking.strategy=heading-aware-v1
rag.chunking.similarity-threshold=0.35
rag.chunking.min-chunk-size=50
rag.chunking.max-chunk-size=1000
rag.chunking.embed-batch-size=32
# ============ 外部网络数据抓取（/api/curl） ============
# 抓取到的 JSON 数据落盘目录（相对启动工作目录）
rag.curl.storage-dir=data/curl
# 网页转 Markdown 的 .txt 落盘目录（可直接导入 RAG）
rag.page.storage-dir=data/pages_txt
# 抓取引擎：jsoup（本地直连，默认）/ firecrawl（云端 JS 渲染+反爬）/ auto（先 jsoup，正文为空或失败时回退 firecrawl）
rag.page.engine=auto
# ============ Firecrawl 云 API（网页增强抓取） ============
# 在 https://www.firecrawl.dev 注册获取 fc- 开头的 Key；此处留空，填写到环境变量 FIRECRAWL_API_KEY 即可
rag.page.firecrawl.api-key=${FIRECRAWL_API_KEY:}
# 云服务地址（自托管时改为本机 Firecrawl 实例地址）
rag.page.firecrawl.base-url=https://api.firecrawl.dev
# 抓取超时（毫秒），云端 JS 渲染比直连慢，默认 30s
rag.page.firecrawl.timeout-ms=30000
# ============ 高德地图 API（天气/地理编码工具） ============
amap.geo.key=${AMAP_GEO_KEY:}
amap.weather.key=${AMAP_WEATHER_KEY:}
# ============ Phase 2 智能文档生成（SUMMARY/REPORT → PDF） ============
# 任务总开关
rag.document-task.enabled=true
# PDF 落盘目录（相对启动工作目录）
rag.document-task.output-dir=data/reports
# 单次章节生成送入 LLM 的检索证据最大字符数（超出按分数/顺序截断）
rag.document-task.max-context-chars=24000
# PDF 内嵌中文字体（随应用打包，不依赖系统字体）
rag.document-task.font-path=classpath:fonts/NotoSansSC-Regular.ttf

